[project]
name = "tl-agent"
version = "0.1.0"
description = "Team lead agentic workflow — 8-phase morning loop with production scaffolding"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "tl-agent" }]
dependencies = [
    # core
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "typer>=0.12",
    "rich>=13.8",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    "anyio>=4.4",
    "tenacity>=9.0",
    "pyyaml>=6.0",
    "python-frontmatter>=1.1",
    "jinja2>=3.1",
    # llm providers
    "anthropic>=0.39",
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.12",
    "itsdangerous>=2.2",
    # observability — OpenTelemetry + Phoenix (arize-phoenix-otel ships an OTLP-compatible exporter)
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-httpx>=0.48b0",
    # mattermost / slack
    "mattermostdriver>=7.3",
    "slack-sdk>=3.31",
    "aiohttp>=3.10", # required by slack-sdk's AsyncWebClient
    "openinference-instrumentation-anthropic>=1.0.5",
]

[project.scripts]
tl-agent = "tl_agent.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.32",
    "mypy>=1.11",
    "pyright>=1.1.380",
    "ruff>=0.6",
    "types-pyyaml>=6.0",
]
mcp = [
    "mcp>=1.0",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tl_agent"]

# -------------------- ruff --------------------
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "services", "evals", "tests", "mcp"]

[tool.ruff.lint]
select = [
    "E", "F", "W",          # pycodestyle / pyflakes
    "I",                     # isort
    "B",                     # bugbear
    "UP",                    # pyupgrade
    "SIM",                   # simplify
    "RUF",                   # ruff-specific
    "ASYNC",                 # async correctness
    "S",                     # bandit-lite
    "TID",                   # tidy-imports
    "PIE", "PERF",
]
ignore = [
    "S101",  # assert in tests is fine
    "S311",  # non-crypto random is fine for jitter
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]
"evals/**" = ["S"]

[tool.ruff.format]
quote-style = "double"

# -------------------- mypy --------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
check_untyped_defs = true
show_error_codes = true
pretty = true
plugins = ["pydantic.mypy"]
# mcp/ is excluded: the `mcp` SDK is an optional extra dep, so its types
# aren't always available at check time. The module guards imports at runtime.
files = ["src", "services", "evals"]

[[tool.mypy.overrides]]
module = ["mattermostdriver.*", "slack_sdk.*"]
ignore_missing_imports = true

# -------------------- pyright --------------------
[tool.pyright]
include = ["src", "services", "evals"]
exclude = ["**/node_modules", "**/__pycache__", "**/.venv", "tests", "mcp"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = "warning"
reportUnknownMemberType = "warning"
reportUnknownArgumentType = "warning"
# typer.Option / typer.Argument are overload-based and stubs report Any —
# warn-not-error to keep our own gaps visible without third-party noise.
reportUnknownVariableType = "warning"

# -------------------- pytest --------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = ["-ra", "--strict-markers", "--strict-config"]
markers = [
    "integration: requires docker-compose stack (deselect with: -m 'not integration')",
    "slow: long-running tests",
    "eval: eval harness cases",
]
