<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}tl-agent{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.3" integrity="sha384-0895/pl2MU10Hqc6jd4RvrthNlDiE9U1tWmX7WRESftEDRosgxNsQG/Ze9YMRzHq" crossorigin="anonymous"></script>
  <style>
    body { font: 14px/1.4 system-ui, sans-serif; max-width: 880px; margin: 32px auto; color: #222; }
    h1   { font-size: 18px; }
    nav  { margin-bottom: 24px; }
    nav a { margin-right: 12px; }
    .card { border: 1px solid #ddd; padding: 12px 16px; margin: 12px 0; border-radius: 6px; background: #fafafa; }
    .mode { display: inline-block; padding: 2px 6px; border-radius: 3px; font-size: 11px; text-transform: uppercase; background: #eef; }
    .body { white-space: pre-wrap; margin: 8px 0; font-family: ui-monospace, monospace; font-size: 13px; }
    button { padding: 4px 10px; margin-right: 6px; }
    .approved { background: #e6ffec; }
    .rejected { background: #ffe6e6; color: #800; }
    .pending  { background: #fffbe6; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <nav>
    <a href="/brief">Today's brief</a>
    <a href="/decisions">Audit log</a>
    <a href="http://localhost:6006">Traces (Phoenix)</a>
  </nav>
  {% block body %}{% endblock %}
</body>
</html>
