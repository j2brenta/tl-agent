# tl-agent — local dev compose.
#
# Services:
#   gitlab          — real GitLab CE for commit + project APIs
#   mattermost      — real Mattermost server (primary ChatProvider)
#   mattermost-db   — postgres backing Mattermost (snapshot/restore target)
#   jira_mock       — FastAPI Jira REST subset (we own the seeds)
#   phoenix         — Arize Phoenix UI for OTel traces
#   ollama          — optional local LLM (under the `local` profile)
#
# Conventions:
#   - Every long-lived service has a healthcheck.
#   - Volumes named with `tla_` prefix for grep-ability.
#   - Ports stable: GitLab 8929, Mattermost 8065, Phoenix 6006, jira_mock 9100,
#     agent web UI 8080.
#
# Per-service profiles (mix and match — boot only the mocks you need):
#   mattermost  → Mattermost + its Postgres   (skip when using real Slack/MM)
#   jira        → jira_mock                    (skip when pointing at real Jira)
#   gitlab      → GitLab CE                     (skip when pointing at real GitLab)
#   agent       → the tl-agent app + web UI
#   local       → Ollama (local LLM)
# Phoenix has no profile — observability is always on.
#
# Examples:
#   # everything bundled (the demo):
#   COMPOSE_PROFILES=mattermost,jira,gitlab,agent docker compose up -d
#   # mock Mattermost, but real Jira + GitLab (set TLA_JIRA_*/TLA_GITLAB_* in .env):
#   COMPOSE_PROFILES=mattermost,agent docker compose up -d
#   # all real (Slack + real Jira + real GitLab) — only the agent + Phoenix boot:
#   COMPOSE_PROFILES=agent docker compose up -d
# The Makefile wraps these as `make up PROFILES=...` and named presets.
#
# Apple Silicon notes:
#   - GitLab CE does NOT publish arm64 images. Set:
#       export TLA_GITLAB_IMAGE=yrzr/gitlab-ce-arm64v8:17.5.0-ce.0
#     (community arm64 build) — or accept the slow amd64-under-Rosetta path.
#   - Everything else here is multi-arch (mattermost, postgres, phoenix,
#     ollama, python:3.12-slim for jira_mock).

services:
  gitlab:
    # Override on arm64 hosts via TLA_GITLAB_IMAGE (see top-of-file note).
    image: ${TLA_GITLAB_IMAGE:-gitlab/gitlab-ce:17.5.0-ce.0}
    container_name: tla-gitlab
    profiles: ["gitlab"]
    restart: unless-stopped
    hostname: gitlab.local
    ports:
      - "8929:8929"
      - "2289:22"
    environment:
      GITLAB_OMNIBUS_CONFIG: |
        external_url 'http://gitlab.local:8929'
        gitlab_rails['gitlab_shell_ssh_port'] = 2289
        prometheus_monitoring['enable'] = false
        gitlab_rails['gitlab_default_can_create_group'] = false
        gitlab_rails['gitlab_signup_enabled'] = false
    volumes:
      - tla_gitlab_config:/etc/gitlab
      - tla_gitlab_logs:/var/log/gitlab
      - tla_gitlab_data:/var/opt/gitlab
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8929/-/readiness || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 30
      start_period: 180s

  mattermost-db:
    image: postgres:16-alpine
    container_name: tla-mm-db
    profiles: ["mattermost"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: mmuser
      POSTGRES_PASSWORD: mmpw
      POSTGRES_DB: mattermost
    volumes:
      - tla_mm_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mmuser -d mattermost"]
      interval: 10s
      timeout: 5s
      retries: 10

  mattermost:
    image: mattermost/mattermost-team-edition:10.1.2
    container_name: tla-mattermost
    profiles: ["mattermost"]
    restart: unless-stopped
    depends_on:
      mattermost-db:
        condition: service_healthy
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: "postgres://mmuser:mmpw@mattermost-db:5432/mattermost?sslmode=disable&connect_timeout=10"
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
      MM_SERVICESETTINGS_SITEURL: "http://localhost:8065"
      MM_SERVICESETTINGS_ENABLELOCALMODE: "true"
      MM_SERVICESETTINGS_LOCALMODESOCKETLOCATION: "/var/tmp/mattermost_local.socket"
      MM_SERVICESETTINGS_ENABLEUSERAPITOKEN: "true"
    ports:
      - "8065:8065"
    volumes:
      - tla_mm_data:/mattermost/data
      - tla_mm_logs:/mattermost/logs
      - tla_mm_config:/mattermost/config
      - tla_mm_plugins:/mattermost/plugins
      - tla_mm_client_plugins:/mattermost/client/plugins
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8065/api/v4/system/ping || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  jira_mock:
    build:
      context: ../services/jira_mock
    container_name: tla-jira-mock
    profiles: ["jira"]
    restart: unless-stopped
    ports:
      - "9100:9100"
    environment:
      JIRA_MOCK_PORT: "9100"
    # Bind-mount JUST the fixtures file (not a whole dir) so `make seed` /
    # host-side edits land in the running container without a rebuild. We
    # avoid mounting /app or /app/fixtures wholesale — that would mask the
    # COPYed app.py / seed.py and break the entrypoint.
    volumes:
      - ../services/jira_mock/fixtures/state.json:/app/fixtures/state.json:ro
    healthcheck:
      # python:3.12-slim has no curl/wget; use stdlib urllib instead.
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:9100/rest/api/3/health', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # --- the tl-agent application ------------------------------------------
  #
  # `agent` is a one-shot runner: invoke CLI subcommands with
  #   docker compose run --rm agent run --date 2026-06-10
  # `web` is the long-lived Phase 8 review UI on :8080.
  #
  # Both share one image (built once) and the same env wiring below. Env is
  # layered: agent.defaults.env supplies the sibling-container DNS URLs, then
  # ../.env is layered on top — so ANY URL you set (uncomment) in .env wins.
  # That ordering IS the mock-vs-real switch: leave TLA_JIRA_BASE_URL unset →
  # the bundled jira_mock; set it (+ TLA_JIRA_TOKEN) → your real Jira, and you
  # just don't run the `jira` profile. Same for GitLab and chat
  # (TLA_CHAT_PROVIDER=slack + TLA_SLACK_*). We layer env_files rather than use
  # ${VAR:-default} interpolation because compose resolves interpolation
  # against infra/.env (the compose-file dir), not the repo-root .env.
  agent:
    build:
      context: ..
      dockerfile: Dockerfile
    image: tl-agent:local
    container_name: tla-agent
    profiles: ["agent"]
    env_file: &agent_env_file
      - ./agent.defaults.env       # sibling-container DNS defaults (loaded first)
      - path: ../.env              # your tokens + real-endpoint overrides (wins)
        required: false
    volumes: &agent_volumes
      - ../data:/app/data        # SQLite state (writable)
      - ../traces:/app/traces    # JSONL span dump (writable)
      - ../config:/app/config    # LAYER 1 markdown — live edits without rebuild
      - ../prompts:/app/prompts  # versioned prompts — live edits without rebuild
    command: ["--help"]

  web:
    image: tl-agent:local
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: tla-web
    profiles: ["agent"]
    env_file: *agent_env_file
    volumes: *agent_volumes
    entrypoint: []  # override the `tl-agent` entrypoint to run uvicorn
    command:
      - uvicorn
      - tl_agent.web.app:app
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
    ports:
      - "8080:8080"
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  phoenix:
    image: arizephoenix/phoenix:version-7.0.0
    container_name: tla-phoenix
    restart: unless-stopped
    ports:
      - "6006:6006"  # UI
      - "4317:4317"  # OTLP gRPC
    environment:
      PHOENIX_PORT: "6006"
    healthcheck:
      # The phoenix image uses python:3.11; use urllib against the UI root
      # (no public /healthz endpoint in v7).
      test:
        - "CMD"
        - "python3"
        - "-c"
        - "import urllib.request; urllib.request.urlopen('http://localhost:6006/', timeout=2).read()"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ollama:
    image: ollama/ollama:latest
    container_name: tla-ollama
    profiles: ["local"]  # only started via `--profile local`
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - tla_ollama:/root/.ollama

volumes:
  tla_gitlab_config: {}
  tla_gitlab_logs: {}
  tla_gitlab_data: {}
  tla_mm_db: {}
  tla_mm_data: {}
  tla_mm_logs: {}
  tla_mm_config: {}
  tla_mm_plugins: {}
  tla_mm_client_plugins: {}
  tla_ollama: {}
